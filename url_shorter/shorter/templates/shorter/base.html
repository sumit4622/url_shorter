{% load static %}
<!doctype html>
<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    {% include 'shorter/header.html' %}
    <div class="container">{% block content %} {% endblock %}</div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Automatically load JS based on app/view -->
    {% if request.resolver_match %}
    <script src="{% static 'js/' %}{{ request.resolver_match.app_name }}/{{ request.resolver_match.url_name }}.js"></script>
    {% endif %}
  </body>
</html>
